name: Deploy Queenshop to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "queenshop/**"
      - ".github/workflows/deploy-queenshop.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: queenshop-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: queenshop
        run: npm install

      - name: Build Queenshop
        working-directory: queenshop
        run: npm run build

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: queenshop/dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
